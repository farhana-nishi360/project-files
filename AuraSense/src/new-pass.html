<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - AuraSense</title>
    <link rel="stylesheet" href="new-pass.css">
</head>
<body>
    <div class="card">
        <div style="background: white; padding: 10px; border-radius: 12px; display: inline-block;">
    <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M48.5 15L35 70H45L50 50L55 70H65L51.5 15H48.5Z" fill="#513B56"/>
        <path d="M62 45L75 80H85L68 35L62 45Z" fill="#513B56"/>
        <path d="M25 80C35 55 65 55 90 80C75 65 45 65 25 80Z" fill="url(#logo-gradient)"/>
        <circle cx="82" cy="40" r="5" fill="#FEE8C3"/>
        <defs>
            <linearGradient id="logo-gradient" x1="25" y1="80" x2="90" y2="80" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#BFA8C7" />
                <stop offset="50%" stop-color="#D2BDCC" />
                <stop offset="100%" stop-color="#FEE8C3" />
            </linearGradient>
        </defs>
    </svg>
    <p style="color: #513B56; margin-top: 0%;padding: 0%;"><b>AuraSense</b></p>
</div>
        <h2 class="form-title">Set New Password</h2>
        <p class="form-subtitle">Create a strong password to protect your AuraSense account</p>
        
        <div class="input-group">
            <label>New Password</label>
            <input type="password" id="new-password" placeholder="Enter new password" class="password-input">
            <small class="password-hint">Minimum 6 characters</small>
        </div>
        
        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Confirm new password" class="password-input">
        </div>
        
        <div id="password-match" class="error-message" style="display: none;">Passwords do not match</div>
        
        <button class="btn-primary" onclick="updatePassword()">Update Password</button>
        
        <p class="back-link">
            <a href="login.html">← Back to Login</a>
        </p>
    </div>

    <script src="new-pass.js"></script>
</body>
</html>
