<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AuraSense</title>
    <link rel="stylesheet" href="reset.css">
</head>
<body>
    <div class="card">

                <h2 class="form-title">Reset your password</h2>
                <p class="form-subtitle">Enter your email to receive a verification code</p>
                
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="reset-email" placeholder="Enter your email">
                </div>
                
                <button class="btn-primary" onclick="sendResetCode()">Send Reset Code</button>
                
              <p style="margin-top:20px; font-size:0.9rem; text-decoration: underline #513B56;"> <a href="Login.html" style="color:#513B56; text-decoration:none; font-weight:600;"> Back to Login </a> </p>       
 
    </div>

    <script src="reset.js"></script>
</body>
</html>
