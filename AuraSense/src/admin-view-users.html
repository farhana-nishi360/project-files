<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AuraSense</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="modal.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #fee8c3 0%, #f6d8c0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        
        /* Navbar Styles */
        .navbar {
            background: #513B56;
            padding: 0 30px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 0;
        }
        .logo i {
            font-size: 28px;
            color: #ffd5c2;
        }
        .logo span {
            font-size: 20px;
            font-weight: bold;
            color: white;
        }
        .logo small {
            font-size: 12px;
            color: #dfcce2;
            display: block;
        }
        .nav-links {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .nav-links a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            color: #dfcce2;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 14px;
        }
        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .nav-links a.active {
            background: #ffd5c2;
            color: #513B56;
        }
        .nav-links a i {
            font-size: 16px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .admin-badge-nav {
            background: #ffd5c2;
            color: #513B56;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .logout-nav-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .logout-nav-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
        }
        
        /* Container Styles */
        .container {
            max-width: 1400px;
            margin: 30px auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(81, 59, 86, 0.1);
        }
        .page-header {
            margin-bottom: 30px;
        }
        .page-header h1 {
            color: #513B56;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #f8f4fa 0%, #f0e8f5 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #513B56;
        }
        .stat-label {
            color: #8e7d91;
            margin-top: 5px;
            font-size: 14px;
        }
        .refresh-btn {
            background: #513B56;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .refresh-btn:hover {
            background: #3d2c41;
            transform: translateY(-2px);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e0dce2;
        }
        th {
            background-color: #513B56;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f8f4fa;
        }
        .admin-badge {
            background: #513B56;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }
        .user-badge {
            background: #8e7d91;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #8e7d91;
        }
        .error {
            text-align: center;
            padding: 40px;
            color: #dc3545;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #8e7d91;
            font-size: 12px;
        }
        
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
            }
            .nav-links {
                justify-content: center;
                margin: 10px 0;
            }
            .user-info {
                margin-bottom: 10px;
            }
            .container {
                padding: 20px;
                margin: 15px;
            }
            th, td {
                padding: 8px 10px;
                font-size: 12px;
            }
            .page-header h1 {
                font-size: 22px;
            }
        }

        /* Bottom Navigation */
.bottom-nav {
    position: sticky;
    bottom: 0;
    background: #513B56;
    display: flex;
    justify-content: space-around;
    padding: 15px 20px;
    border-top: 1px solid #e0dce2;
    margin-top: 20px;
    box-shadow: 0 -2px 15px rgba(0, 0, 0, 0.05);
}

@media (min-width: 768px) {
    .bottom-nav {
        justify-content: center;
        gap: 80px;
        padding: 18px 20px;
    }
}

.bottom-nav i {
    font-size: clamp(22px, 5vw, 28px);
    color: #f0cae5;
    cursor: pointer;
    transition: color 0.3s, transform 0.2s;
}

.bottom-nav i:hover {
    color: #ded6e0;
    transform: translateY(-3px);
}

.bottom-nav i.active {
    color: #ffffff;
}
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
       <div style="background: white; padding: 10px; border-radius: 12px; display: inline-block;">
    <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M48.5 15L35 70H45L50 50L55 70H65L51.5 15H48.5Z" fill="#513B56"/>
        <path d="M62 45L75 80H85L68 35L62 45Z" fill="#513B56"/>
        <path d="M25 80C35 55 65 55 90 80C75 65 45 65 25 80Z" fill="url(#logo-gradient)"/>
        <circle cx="82" cy="40" r="5" fill="#FEE8C3"/>
        <defs>
            <linearGradient id="logo-gradient" x1="25" y1="80" x2="90" y2="80" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#BFA8C7" />
                <stop offset="50%" stop-color="#D2BDCC" />
                <stop offset="100%" stop-color="#FEE8C3" />
            </linearGradient>
        </defs>
    </svg>
</div>
                <div>
                    <span>AuraSense</span>
                    <small>Admin Panel</small>
                </div>
            </div>
            <div class="nav-links">
                <a href="admin-view-users.html" class="active">
                    <i class="fas fa-users"></i> Users
                </a>
                <a href="admin-dashboard.html">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                
                <a href="home.html">
                    <i class="fas fa-home"></i> Home
                </a>
            </div>
            <div class="user-info">
                <span class="admin-badge-nav">
                    <i class="fas fa-shield-alt"></i> Admin
                </span>
                <button class="logout-nav-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="page-header">
            <h1>
                <i class="fas fa-users"></i> Registered Users
            </h1>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="adminCount">0</div>
                <div class="stat-label">Administrators</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="userCount">0</div>
                <div class="stat-label">Regular Users</div>
            </div>
        </div>
        
        <button class="refresh-btn" onclick="loadUsers()">
            <i class="fas fa-sync-alt"></i> Refresh Data
        </button>
        
        <div style="overflow-x: auto;">
            <table id="userTable">
                <thead>
                    <tr>
                        <th><i class="fas fa-user"></i> Name</th>
                        <th><i class="fas fa-envelope"></i> Email</th>
                        <th><i class="fas fa-tag"></i> Role</th>
                        <th><i class="fas fa-calendar"></i> Created At</th>
                        <th><i class="fas fa-clock"></i> Last Login</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="5" class="loading">
                            <i class="fas fa-spinner fa-spin"></i> Loading users...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="footer">
<nav class="bottom-nav">
            <i class="fas fa-home active"></i>
            <i class="fas fa-compass"></i>
            <i class="fas fa-music"></i>
            <i class="fas fa-user"></i>
        </nav>

    </div>
    <script src="utils.js"></script>

    <script>
        // Get admin ID from localStorage (set during login)
        const adminId = localStorage.getItem('adminId');
        
        // If no admin ID, redirect to login
        if (!adminId) {
            alert('Please login as admin first');
            window.location.href = 'admin-login.html';
        }
        
        async function loadUsers() {
            if (!adminId) return;
            
            // Show loading
            document.getElementById('userTableBody').innerHTML = '<tr><td colspan="5" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading users...</td></tr>';
            
            try {
                const response = await fetch(`/api/auth/users?adminId=${adminId}`);
                const data = await response.json();
                
                if (data.success && data.users) {
                    const tbody = document.getElementById('userTableBody');
                    tbody.innerHTML = '';
                    
                    let adminCount = 0;
                    let userCount = 0;
                    
                    data.users.forEach(user => {
                        const row = tbody.insertRow();
                        row.insertCell(0).innerHTML = `<i class="fas fa-user-circle"></i> ${user.name || 'N/A'}`;
                        row.insertCell(1).innerHTML = `<i class="fas fa-envelope"></i> ${user.email || 'N/A'}`;
                        
                        // Role badge
                        if (user.isAdmin) {
                            row.insertCell(2).innerHTML = '<span class="admin-badge"><i class="fas fa-crown"></i> Admin</span>';
                            adminCount++;
                        } else {
                            row.insertCell(2).innerHTML = '<span class="user-badge"><i class="fas fa-user"></i> User</span>';
                            userCount++;
                        }
                        
                        row.insertCell(3).innerHTML = user.createdAt ? `<i class="fas fa-calendar"></i> ${new Date(user.createdAt).toLocaleDateString()}` : 'N/A';
                        row.insertCell(4).innerHTML = user.lastLogin ? `<i class="fas fa-clock"></i> ${new Date(user.lastLogin).toLocaleString()}` : 'Never';
                    });
                    
                    // Update stats
                    document.getElementById('totalUsers').textContent = data.users.length;
                    document.getElementById('adminCount').textContent = adminCount;
                    document.getElementById('userCount').textContent = userCount;
                    
                } else {
                    document.getElementById('userTableBody').innerHTML = `<tr><td colspan="5" class="error"><i class="fas fa-exclamation-triangle"></i> Error: ${data.message || 'Unknown error'}</td></tr>`;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('userTableBody').innerHTML = `<tr><td colspan="5" class="error"><i class="fas fa-wifi"></i> Connection error: ${error.message}</td></tr>`;
            }
        }
        
        function logout() {
            localStorage.removeItem('adminId');
            localStorage.removeItem('adminName');
            localStorage.removeItem('isAdmin');
            window.location.href = 'admin-login.html';
        }
        
        // Load users when page loads
        loadUsers();
    </script>
</body>
</html>
