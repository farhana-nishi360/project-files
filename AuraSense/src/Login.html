<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraSense | Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="modal.css">
   
</head>
<body>
    <div class="app-container">
        <main class="login-card">
            <div style="background: white; padding: 10px; border-radius: 12px; display: inline-block;">
    <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M48.5 15L35 70H45L50 50L55 70H65L51.5 15H48.5Z" fill="#513B56"/>
        <path d="M62 45L75 80H85L68 35L62 45Z" fill="#513B56"/>
        <path d="M25 80C35 55 65 55 90 80C75 65 45 65 25 80Z" fill="url(#logo-gradient)"/>
        <circle cx="82" cy="40" r="5" fill="#FEE8C3"/>
        <defs>
            <linearGradient id="logo-gradient" x1="25" y1="80" x2="90" y2="80" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#BFA8C7" />
                <stop offset="50%" stop-color="#D2BDCC" />
                <stop offset="100%" stop-color="#FEE8C3" />
            </linearGradient>
        </defs>
    </svg>
    <p style="color: #513B56; margin-top: 0%;padding: 0%;"><b>AuraSense</b></p>
</div>
            <h1 class="form-title">Login</h1>
            
            <form id="loginForm">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                    <div class="forgot-password-container">
                        <a href="reset.html" class="forgot-link">Forgot your password?</a>
                    </div>
                </div>

                <div class="signup-redirect">
                    <p>Don't have an account yet?</p>
                    <a href="createAcc.html" class="signup-hyperlink">Sign up for free</a>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">Login</button>
            </form>
        </main>
    </div>
    <script src="utils.js"></script>
    <script src="login.js"></script>
</body>
</html>
