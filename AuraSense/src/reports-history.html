<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports History - AuraSense</title>
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .reports-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .report-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(81, 59, 86, 0.08);
            transition: transform 0.3s;
        }
        .report-card:hover {
            transform: translateY(-3px);
        }
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0dce2;
        }
        .report-week {
            font-size: 16px;
            font-weight: bold;
            color: #513B56;
        }
        .report-date {
            font-size: 12px;
            color: #8e7d91;
        }
        .report-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #513B56;
        }
        .stat-label {
            font-size: 11px;
            color: #8e7d91;
        }
        .report-insight {
            background: #f8f4fa;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            border-left: 4px solid #513B56;
        }
        .report-insight i {
            color: #513B56;
            margin-right: 8px;
        }
        .report-insight p {
            color: #8e7d91;
            font-size: 13px;
            line-height: 1.5;
        }
        .no-reports {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 20px;
            color: #8e7d91;
        }
        .no-reports i {
            font-size: 48px;
            margin-bottom: 15px;
            color: #513B56;
        }
        .loading-reports {
            text-align: center;
            padding: 60px;
            color: #8e7d91;
        }
        .back-btn-header {
            background: #513B56;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn-header:hover {
            background: #3d2c41;
        }
        .header {
            display: flex;
            align-items: center;
            padding: 20px;
            background: #513B56;
            color: white;
        }
        .header h1 {
            flex: 1;
            text-align: center;
            font-size: 20px;
        }
        .header p {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn-header" onclick="window.location.href='profile.html'">
            <i class="fas fa-arrow-left"></i> Back
        </button>
        <div>
            <h1>Progress Reports History</h1>
            <p>Your wellness journey timeline</p>
        </div>
        <div style="width: 100px;"></div>
    </div>

    <div class="reports-container" id="reportsList">
        <div class="loading-reports">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading reports history...</p>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('userId');
        
        async function loadReportsHistory() {
            const container = document.getElementById('reportsList');
            
            try {
                const response = await fetch(`/api/auth/progress-reports?userId=${userId}`);
                const data = await response.json();
                
                if (data.success && data.reports && data.reports.length > 0) {
                    displayReports(data.reports);
                } else {
                    container.innerHTML = `
                        <div class="no-reports">
                            <i class="fas fa-chart-line"></i>
                            <p>No reports generated yet</p>
                            <small>Complete tasks to generate weekly reports!</small>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading reports:', error);
                container.innerHTML = `
                    <div class="no-reports">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Error loading reports</p>
                        <small>Please try again later</small>
                    </div>
                `;
            }
        }
        
        function displayReports(reports) {
            const container = document.getElementById('reportsList');
            container.innerHTML = '';
            
            const sortedReports = [...reports].sort((a, b) => new Date(b.weekStart) - new Date(a.weekStart));
            
            sortedReports.forEach(report => {
                const weekStart = new Date(report.weekStart);
                const weekEnd = new Date(report.weekEnd);
                
                const card = document.createElement('div');
                card.className = 'report-card';
                card.innerHTML = `
                    <div class="report-header">
                        <span class="report-week">Week of ${weekStart.toLocaleDateString()}</span>
                        <span class="report-date">${weekStart.toLocaleDateString()} - ${weekEnd.toLocaleDateString()}</span>
                    </div>
                    <div class="report-stats">
                        <div class="stat">
                            <div class="stat-value">${report.totalTasks || 0}</div>
                            <div class="stat-label">Total Tasks</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${report.completedTasks || 0}</div>
                            <div class="stat-label">Completed</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${report.completionRate || 0}%</div>
                            <div class="stat-label">Completion Rate</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${report.streak || 0}</div>
                            <div class="stat-label">Day Streak</div>
                        </div>
                    </div>
                    <div class="report-insight">
                        <i class="fas fa-robot"></i>
                        <p>${report.insights || 'Complete tasks to get insights!'}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        loadReportsHistory();
    </script>
</body>
</html>
