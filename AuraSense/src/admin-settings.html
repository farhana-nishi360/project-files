<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settings - AuraSense</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="modal.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #fee8c3 0%, #f6d8c0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .navbar {
            background: #513B56;
            padding: 0 30px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 0;
        }
        .logo i { font-size: 28px; color: #ffd5c2; }
        .logo span { font-size: 20px; font-weight: bold; color: white; }
        .logo small { font-size: 12px; color: #dfcce2; display: block; }
        .nav-links { display: flex; gap: 5px; flex-wrap: wrap; }
        .nav-links a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            color: #dfcce2;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 14px;
        }
        .nav-links a:hover { background: rgba(255, 255, 255, 0.1); color: white; }
        .nav-links a.active { background: #ffd5c2; color: #513B56; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .admin-badge-nav { background: #ffd5c2; color: #513B56; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .logout-nav-btn { background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .container { max-width: 1400px; margin: 30px auto; background: white; border-radius: 20px; padding: 30px; }
        .footer { text-align: center; padding: 20px; color: #8e7d91; font-size: 12px; }
        @media (max-width: 768px) {
            .nav-container { flex-direction: column; }
            .nav-links { justify-content: center; margin: 10px 0; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-leaf"></i>
                <div><span>AuraSense</span><small>Admin Panel</small></div>
            </div>
            <div class="nav-links">
                <a href="admin-view-users.html"><i class="fas fa-users"></i> Users</a>
                <a href="admin-dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="admin-settings.html" class="active"><i class="fas fa-cog"></i> Settings</a>
                <a href="home.html"><i class="fas fa-home"></i> Home</a>
            </div>
            <div class="user-info">
                <span class="admin-badge-nav"><i class="fas fa-shield-alt"></i> Admin</span>
                <button class="logout-nav-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>
    <div class="container">
        <h1><i class="fas fa-cog"></i> Admin Settings</h1>
        <p style="margin-top: 20px; color: #8e7d91;">Settings page coming soon...</p>
    </div>
    <div class="footer"><p>&copy; 2024 AuraSense - Admin Settings</p></div>
    <script src="utils.js"></script>
    <script>
        if (!localStorage.getItem('adminId')) window.location.href = 'admin-login.html';
        function logout() { localStorage.clear(); window.location.href = 'admin-login.html'; }
    </script>
</body>
</html>
