<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - AuraSense</title>
    <link rel="stylesheet" href="otp.css">
</head>
<body>
    <div class="card">
        
                <h2>Verify OTP</h2>
                <p style="text-align: center; color: #666; margin-bottom: 10px;">We sent a code to</p>
                <p style="text-align: center; font-weight: 600; color: #764ba2; margin-bottom: 30px;" id="user-email">abc@gmail.com</p>
                
                <div class="otp-boxes">
                    <input type="text" class="otp-box" maxlength="1" onkeyup="moveToNext(this, 0)" onkeydown="handleBackspace(event, this, 0)" autofocus>
                    <input type="text" class="otp-box" maxlength="1" onkeyup="moveToNext(this, 1)" onkeydown="handleBackspace(event, this, 1)">
                    <input type="text"class="otp-box" maxlength="1" onkeyup="moveToNext(this, 2)" onkeydown="handleBackspace(event, this, 2)">
                    <input type="text" class="otp-box"  maxlength="1" onkeyup="moveToNext(this, 3)" onkeydown="handleBackspace(event, this, 3)">
                </div>
                
                <p style="text-align: center; color: #513b56; margin: 20px 0;">Didn't receive code? <a href="#" onclick="resendOTP()" style="color: #764ba2;">Resend</a></p>
                
                <button class="btn-primary" onclick="verifyOTP()">Verify & Proceed</button>
                
                <div class="link-reset">
                    <a href="reset.html">Back to Reset</a>
                </div>
                    
                
            
    
    </div>

    <script src="otp.js"></script>
</body>
</html>
