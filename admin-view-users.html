<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Users - AuraSense</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="modal.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #fee8c3 0%, #f6d8c0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-bottom: 0;
        }
        
        .navbar {
            background: #513B56;
            padding: 0 30px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 0;
        }
        .logo i {
            font-size: 28px;
            color: #ffd5c2;
        }
        .logo span {
            font-size: 20px;
            font-weight: bold;
            color: white;
        }
        .logo small {
            font-size: 12px;
            color: #dfcce2;
            display: block;
        }
        .nav-links {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .nav-links a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            color: #dfcce2;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 14px;
        }
        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .nav-links a.active {
            background: #ffd5c2;
            color: #513B56;
        }
        .nav-links a i {
            font-size: 16px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .admin-badge-nav {
            background: #ffd5c2;
            color: #513B56;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .logout-nav-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .logout-nav-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
        }
        
        .delete-btn {
            background: none;
            border: none;
            color: #b33c4a;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .delete-btn:hover {
            background: #fee8e8;
            color: #a12836;
            transform: scale(1.1);
        }
        .delete-btn i {
            pointer-events: none;
        }
        .action-cell {
            text-align: center;
        }
        
        .container {
            max-width: 1400px;
            margin: 20px auto;
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 20px 20px 80px 20px;
            box-shadow: 0 10px 30px rgba(81, 59, 86, 0.1);
        }
        .page-header {
            margin-bottom: 30px;
        }
        .page-header h1 {
            color: #513B56;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #f8f4fa 0%, #f0e8f5 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #513B56;
        }
        .stat-label {
            color: #8e7d91;
            margin-top: 5px;
            font-size: 14px;
        }
        .refresh-btn {
            background: #513B56;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .refresh-btn:hover {
            background: #3d2c41;
            transform: translateY(-2px);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e0dce2;
        }
        th {
            background-color: #513B56;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f8f4fa;
        }
        .admin-badge {
            background: #513B56;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }
        .user-badge {
            background: #8e7d91;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #8e7d91;
        }
        .error {
            text-align: center;
            padding: 40px;
            color: #dc3545;
        }
        
        @media (max-width: 768px) {
            .nav-container { flex-direction: column; }
            .nav-links { justify-content: center; margin: 10px 0; }
            .user-info { margin-bottom: 10px; }
            .container { padding: 15px 15px 70px 15px; margin: 10px; }
            th, td { padding: 8px 10px; font-size: 12px; }
            .page-header h1 { font-size: 22px; }
        }

        @media (max-width: 480px) {
            .container { padding: 10px 10px 60px 10px; margin: 5px; border-radius: 15px 15px 0 0; }
            th, td { padding: 6px 8px; font-size: 11px; }
            .stats { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .stat-card { padding: 12px 8px; }
            .stat-number { font-size: 22px; }
            .stat-label { font-size: 11px; }
            .refresh-btn { padding: 8px 16px; font-size: 12px; }
            .page-header h1 { font-size: 18px; }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            background: #513B56;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 10px;
            box-shadow: 0 -2px 15px rgba(0, 0, 0, 0.15);
            z-index: 9999;
            min-height: 50px;
            border-radius: 0;
        }

        @media (min-width: 768px) {
            .bottom-nav {
                justify-content: center;
                gap: 80px;
                padding: 10px 20px;
                min-height: 55px;
            }
        }

        @media (max-width: 480px) {
            .bottom-nav { padding: 6px 8px; min-height: 42px; gap: 5px; }
            .bottom-nav i { font-size: 16px !important; padding: 4px 6px; }
        }

        .bottom-nav i {
            font-size: clamp(18px, 3.5vw, 24px);
            color: #f0cae5;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px 8px;
            border-radius: 8px;
        }

        .bottom-nav i:hover {
            color: #ffffff;
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.1);
        }

        .bottom-nav i.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
        }

        .footer-wrapper {
            width: 100%;
            margin: 0;
            padding: 0;
            background: #513B56;
            border-radius: 0;
            overflow: hidden;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 9998;
        }

        .footer {
            text-align: center;
            padding: 4px 10px;
            color: #dfcce2;
            font-size: clamp(9px, 1.2vw, 11px);
            background: #513B56;
            width: 100%;
        }

        .footer p {
            margin: 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <div style="background: white; padding: 10px; border-radius: 12px; display: inline-block;">
                    <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M48.5 15L35 70H45L50 50L55 70H65L51.5 15H48.5Z" fill="#513B56"/>
                        <path d="M62 45L75 80H85L68 35L62 45Z" fill="#513B56"/>
                        <path d="M25 80C35 55 65 55 90 80C75 65 45 65 25 80Z" fill="url(#logo-gradient)"/>
                        <circle cx="82" cy="40" r="5" fill="#FEE8C3"/>
                        <defs>
                            <linearGradient id="logo-gradient" x1="25" y1="80" x2="90" y2="80" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#BFA8C7" />
                                <stop offset="50%" stop-color="#D2BDCC" />
                                <stop offset="100%" stop-color="#FEE8C3" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div>
                    <span>AuraSense</span>
                    <small>Admin Panel</small>
                </div>
            </div>
            <div class="nav-links">
                <a href="admin-view-users.html" class="active">
                    <i class="fas fa-users"></i> Users
                </a>
                <a href="admin-settings.html">
                    <i class="fas fa-cog"></i> Settings
                </a>
                <a href="home.html">
                    <i class="fas fa-home"></i> Home
                </a>
            </div>
            <div class="user-info">
                <span class="admin-badge-nav">
                    <i class="fas fa-shield-alt"></i> Admin
                </span>
                <button class="logout-nav-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>
                <i class="fas fa-users"></i> Registered Users
            </h1>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="adminCount">0</div>
                <div class="stat-label">Administrators</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="userCount">0</div>
                <div class="stat-label">Regular Users</div>
            </div>
        </div>
        
        <button class="refresh-btn" onclick="loadUsers()">
            <i class="fas fa-sync-alt"></i> Refresh Data
        </button>
        
        <div style="overflow-x: auto;">
            <table id="userTable">
                <thead>
                    <tr>
                        <th><i class="fas fa-user"></i> Name</th>
                        <th><i class="fas fa-envelope"></i> Email</th>
                        <th><i class="fas fa-tag"></i> Role</th>
                        <th><i class="fas fa-calendar"></i> Created At</th>
                        <th><i class="fas fa-clock"></i> Last Login</th>
                        <th><i class="fas fa-trash-alt"></i> Action</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="6" class="loading">
                            <i class="fas fa-spinner fa-spin"></i> Loading users...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="footer-wrapper">
        <nav class="bottom-nav">
            <i class="fas fa-home active" id="footerHome" onclick="goToHome()"></i>
            <i class="fas fa-user-shield" id="footerAdmin" onclick="goToAdminLogin()"></i>
            <i class="fas fa-music" id="footerMusic" onclick="goToMusic()"></i>
            <i class="fas fa-user" id="footerUser" onclick="goToProfile()"></i>
        </nav>
        <div class="footer">
            <p>AuraSense &copy; 2026. All rights reserved.</p>
        </div>
    </div>

    <script>
    const adminId = localStorage.getItem('adminId');
    const adminName = localStorage.getItem('adminName');
    
    if (!adminId) {
        alert('Please login as admin first');
        window.location.href = 'admin-login.html';
    }
    
    console.log('👑 Admin View Users - Logged in as:', adminName);

    // ---------- BOTTOM NAVIGATION FUNCTIONS ----------
    function goToHome() {
        window.location.href = 'home.html';
    }

    function goToAdminLogin() {
        window.location.href = 'admin-login.html';
    }

    function goToMusic() {
        window.location.href = 'home.html#meditationMusicSection';
    }

    function goToProfile() {
        window.location.href = 'admin-settings.html';
    }

    // ---------- DELETE USER ----------
    async function deleteUser(userId) {
        if (!adminId) return;
        if (!confirm('Delete this user? This action cannot be undone.')) return;

        if (!userId) {
            alert('Error: User ID is missing');
            return;
        }

        try {
            const row = document.querySelector(`tr[data-user-id="${userId}"]`);
            const deleteBtn = row?.querySelector('.delete-btn');
            if (deleteBtn) {
                deleteBtn.disabled = true;
                deleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            }

            const response = await fetch(`/api/auth/users/${userId}?adminId=${adminId}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' }
            });

            const data = await response.json();

            if (data.success) {
                if (row) row.remove();
                alert('User deleted successfully!');
                await loadUsers();
            } else {
                alert('Failed to delete user: ' + (data.message || 'Unknown error'));
                await loadUsers();
            }
        } catch (error) {
            console.error('Delete error:', error);
            alert('Connection error while deleting user. Please try again.');
            await loadUsers();
        }
    }

    async function loadUsers() {
        if (!adminId) return;
        
        document.getElementById('userTableBody').innerHTML = '<tr><td colspan="6" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading users...</td></tr>';
        
        try {
            const response = await fetch(`/api/auth/users?adminId=${adminId}`);
            const data = await response.json();
            
            if (data.success && data.users) {
                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = '';
                
                let adminCount = 0;
                let userCount = 0;
                
                data.users.forEach(user => {
                    const row = tbody.insertRow();
                    row.setAttribute('data-user-id', user._id);
                    
                    row.insertCell(0).innerHTML = `<i class="fas fa-user-circle"></i> ${user.name || 'N/A'}`;
                    row.insertCell(1).innerHTML = `<i class="fas fa-envelope"></i> ${user.email || 'N/A'}`;
                    
                    if (user.isAdmin) {
                        row.insertCell(2).innerHTML = '<span class="admin-badge"><i class="fas fa-crown"></i> Admin</span>';
                        adminCount++;
                    } else {
                        row.insertCell(2).innerHTML = '<span class="user-badge"><i class="fas fa-user"></i> User</span>';
                        userCount++;
                    }
                    
                    row.insertCell(3).innerHTML = user.createdAt ? `<i class="fas fa-calendar"></i> ${new Date(user.createdAt).toLocaleDateString()}` : 'N/A';
                    row.insertCell(4).innerHTML = user.lastLogin ? `<i class="fas fa-clock"></i> ${new Date(user.lastLogin).toLocaleString()}` : 'Never';
                    
                    const actionCell = row.insertCell(5);
                    actionCell.className = 'action-cell';
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
                    deleteBtn.title = 'Delete user';
                    deleteBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        deleteUser(user._id);
                    });
                    actionCell.appendChild(deleteBtn);
                });
                
                document.getElementById('totalUsers').textContent = data.users.length;
                document.getElementById('adminCount').textContent = adminCount;
                document.getElementById('userCount').textContent = userCount;
                
            } else {
                document.getElementById('userTableBody').innerHTML = `<tr><td colspan="6" class="error"><i class="fas fa-exclamation-triangle"></i> Error: ${data.message || 'Unknown error'}</td></tr>`;
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('userTableBody').innerHTML = `<tr><td colspan="6" class="error"><i class="fas fa-wifi"></i> Connection error: ${error.message}</td></tr>`;
        }
    }
    
    function logout() {
        localStorage.clear();
        window.location.href = 'admin-login.html';
    }
    
    loadUsers();
    </script>
</body>
</html>
